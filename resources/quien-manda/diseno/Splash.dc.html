<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pantalla de inicio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Plus+Jakarta+Sans:wght@800&display=swap">
<style>
body{margin:0}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
.bar{width:40%;animation:slide 1.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.bar{animation:none;width:40%}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--s100); color: var(--ink); font-family: Inter, system-ui, -apple-system, sans-serif; {{themeVars}}">
<a href="Main.dc.html" aria-label="Abrir la app" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; box-sizing: border-box; padding: 24px 24px 48px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; color: inherit; text-decoration: none">

<div></div>

<div style="display: flex; flex-direction: column; align-items: center; gap: 24px">
<div style="width: 132px; height: 132px; border-radius: 30px; overflow: hidden; border: 1px solid var(--line); box-sizing: border-box">
<dc-import name="Icono" variant="{{iconVariant}}" size="130" hint-size="130px,130px"></dc-import>
</div>
<h1 style="margin: 0; font-family: 'Plus Jakarta Sans', Inter, system-ui, sans-serif; font-weight: 800; font-size: 40px; line-height: 44px; letter-spacing: -0.02em">Quién Manda</h1>
<div style="width: 96px; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden"><div class="bar" style="height: 4px; background: var(--verde)"></div></div>
</div>

<div style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
<div style="width: 24px; height: 4px; background: var(--verde)"></div>
<div style="font-size: 13px; line-height: 18px; color: var(--muted)">Hecha por</div>
<div style="font-size: 13px; line-height: 18px; font-weight: 600">Salva Tejero Software Company</div>
</div>

</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.dark === undefined || this.props.dark === null) ? true : this.props.dark;
    const themeVars = dark
      ? '--s100:#141110;--s200:#211B17;--ink:#F1E6D0;--muted:#C9B99A;--verde:#6FB07C;--on-verde:#141110;--line:rgba(241,230,208,0.14)'
      : '--s100:#FFFFFF;--s200:#F4F1EA;--ink:#141110;--muted:#6B5A45;--verde:#35693F;--on-verde:#FFFFFF;--line:rgba(20,17,16,0.14)';
    return { themeVars: themeVars, iconVariant: dark ? 'oscuro' : 'claro' };
  }
}
</script>
</body>
</html>
