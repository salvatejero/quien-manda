name: SonyMando
options:
  bundleIdPrefix: es.julia.angela.app
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  SonyMando:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: "Quién Manda"
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: Fondo
          UIImageName: Splash
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationPortraitUpsideDown]
        NSLocalNetworkUsageDescription: Para encontrar y controlar tu TV en la red Wi-Fi.
        NSBonjourServices: [_googlecast._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    scheme:
      testTargets: [SonyMandoTests]
      storeKitConfiguration: Tests/Cafe.storekit # solo para probar en local (Xcode y tests)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.julia.angela.app.quienmanda
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
  SonyMandoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: SonyMando
